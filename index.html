<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <title>Disney</title>
</head>
<body>
    <nav class="navbar">
            <div class="navbar__left">
                <img src="img/logo.png" alt="Disney" class="navbar__logo">
                <ul class="navbar__menu">
                    <li><a href="#disney-plus" class="navbar__link">DISNEY+</a></li>
                    <li><a href="#parks-and-travel" class="navbar__link">PARKS & TRAVEL</a></li>
                    <li><a href="#movies" class="navbar__link">MOVIES</a></li>
                    <li><a href="#shop" class="navbar__link">SHOP</a></li>
                    <li><a href="#more" class="navbar__link">MORE</a></li>
                </ul>
            </div>
            <div class="navbar__right">
                    <a href="" class="navbar__login">LOG IN</a>
                    <form action="" class="navbar__search">
                        <input type="text" placeholder="Search" class="navbar__input">
                        <button class="navbar__button"><i class="fa-solid fa-magnifying-glass"></i></button>
                    </form>
            </div>
    </nav>

    <section class="banner">
        <div class="banner__content">
            <img src="img/snow-white.png" alt="Disney Snow White" class="banner__title">
            <p class="banner__text">Experience Snow White, now playing only in theaters!</p>
            <div class="banner__buttons">
                <a href="#" class="banner__button banner__button--primary">Get Tickets</a>
                <a href="#" class="banner__button banner__button--outline">Learn More</a>
            </div>
        </div>
    </section>

    <main>
        <section id="shop"></section>
        <section id="disney-plus"></section>
        <section id="movies"></section>
        <section id="parks-and-travel"></section>
        <section id="more"></section>
    </main>

    <footer></footer>
</body>
</html>
